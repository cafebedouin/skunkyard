[package]
name = "slhdsa-rust-rig"
version = "0.1.0"
edition = "2021"
description = "Three-way agreement run: a thin wrapper over RustCrypto's slh-dsa crate (SLH-DSA-SHA2-128s) that takes the conformance rig's files (skunks/policy/6-rekey/slhdsa, skunks/pqwallet/diff) and signs or judges on them. No new cryptography."
publish = false

[dependencies]
slh-dsa = "=0.2.0-rc.5"
hex = "0.4.3"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
getrandom = "0.3"

[profile.release]
opt-level = 3
